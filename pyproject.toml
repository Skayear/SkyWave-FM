[project]
name = "skywave"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Skayear", email = "skayearjbueno@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kokoro>=0.9.4",
    "mutagen>=1.48.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "typer>=0.27.1",
]

[project.scripts]
skywave = "skywave:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
