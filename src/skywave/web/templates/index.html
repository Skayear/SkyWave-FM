<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>SkyWave FM</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 3rem 1rem;
    }
    h1 { margin: 0; letter-spacing: 0.05em; }
    audio { width: 100%; max-width: 420px; }
    #now-playing {
      text-align: center;
      min-height: 3rem;
    }
    #now-playing .titulo { font-size: 1.1rem; }
    #now-playing .artista { color: #999; }
    #queue {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    #queue h2 {
      font-size: 0.9rem;
      color: #999;
      font-weight: normal;
      margin: 0 0 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #queue-list {
      list-style: none;
      margin: 0;
      padding: 0;
      font-size: 0.9rem;
    }
    #queue-list li {
      padding: 0.15rem 0;
      color: #ccc;
    }
    #queue-list li span { color: #888; }
    #saludo-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      max-width: 420px;
    }
    #saludo-mensaje {
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      background: #1c1c1c;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 0.5rem;
      font-family: inherit;
    }
    #saludo-form button {
      align-self: flex-end;
      background: #2a5;
      color: #111;
      border: none;
      border-radius: 4px;
      padding: 0.4rem 1rem;
      cursor: pointer;
    }
    #saludo-form button:disabled { opacity: 0.5; cursor: default; }
    #saludo-estado { font-size: 0.9rem; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>📻 SkyWave FM</h1>
  <audio controls src="{{ stream_url }}"></audio>
  <div id="now-playing">
    <div class="titulo" id="np-titulo">Sintonizando...</div>
    <div class="artista" id="np-artista"></div>
  </div>

  <div id="queue">
    <h2>A continuación</h2>
    <ul id="queue-list"></ul>
  </div>

  <form id="saludo-form">
    <textarea
      id="saludo-mensaje"
      rows="2"
      maxlength="200"
      placeholder="Mandá un saludo al aire..."
      required
    ></textarea>
    <button type="submit">Mandar saludo</button>
    <div id="saludo-estado"></div>
  </form>

  <script>
    // textContent, no innerHTML: título/artista vienen de tags de audio
    // (mutagen), no son HTML de confianza.
    const npTitulo = document.getElementById("np-titulo");
    const npArtista = document.getElementById("np-artista");

    function pintarSonandoAhora(data) {
      if (data === null) {
        npTitulo.textContent = "La radio está apagada.";
        npArtista.textContent = "";
        return;
      }
      npTitulo.textContent = data.track.title;
      npArtista.textContent = data.track.artist;
    }

    // "A continuación" (issue #38): vista previa aproximada, no una
    // cola garantizada -- se recalcula cada vez que se pide. Elementos
    // creados con textContent, no innerHTML: título/artista vienen de
    // tags de audio, no son HTML de confianza.
    const queueList = document.getElementById("queue-list");

    async function actualizarCola() {
      try {
        const resp = await fetch("/queue");
        const data = await resp.json();
        queueList.replaceChildren(
          ...data.upcoming.map((item) => {
            const li = document.createElement("li");
            const artista = document.createElement("span");
            li.textContent = item.title + " — ";
            artista.textContent = item.artist;
            li.appendChild(artista);
            return li;
          })
        );
      } catch {
        queueList.replaceChildren();
      }
    }

    actualizarCola();

    // GET /ws empuja el "sonando ahora" apenas cambia -- nada de
    // polling HTTP desde acá. Si el socket se cae (proxy que corta
    // conexiones ociosas, reinicio del server), se reconecta solo.
    function conectarSonandoAhora() {
      const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${protocolo}//${location.host}/ws`);

      ws.onmessage = (event) => {
        pintarSonandoAhora(JSON.parse(event.data));
        actualizarCola(); // el tema cambió -- la proyección de "a continuación" también
      };
      ws.onerror = () => ws.close();
      ws.onclose = () => setTimeout(conectarSonandoAhora, 3000);
    }

    conectarSonandoAhora();

    const saludoForm = document.getElementById("saludo-form");
    const saludoMensaje = document.getElementById("saludo-mensaje");
    const saludoEstado = document.getElementById("saludo-estado");
    const saludoBoton = saludoForm.querySelector("button");

    // Mensajes por código de estado -- el backend (POST /greetings)
    // devuelve 422 por moderación o mensaje vacío, 429 por rate limit.
    const MENSAJES_ERROR = {
      422: "Ese mensaje no se puede mandar.",
      429: "Mandaste demasiados saludos, esperá un poco.",
    };

    saludoForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      saludoBoton.disabled = true;
      saludoEstado.textContent = "Enviando...";
      try {
        const resp = await fetch("/greetings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: saludoMensaje.value }),
        });
        if (resp.ok) {
          saludoEstado.textContent = "¡Saludo enviado!";
          saludoMensaje.value = "";
        } else {
          saludoEstado.textContent = MENSAJES_ERROR[resp.status] ?? "No se pudo enviar.";
        }
      } catch {
        saludoEstado.textContent = "No se pudo enviar.";
      } finally {
        saludoBoton.disabled = false;
      }
    });
  </script>
</body>
</html>
